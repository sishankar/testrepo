name: Deploy Node App (Self-Hosted Runner)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: mine

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install 

      - name: Restart app with PM2
        run: |
          pm2 start index.js --name nodeapp
