name: Deploy Node App (Self-Hosted Runner)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: mine   # 👈 important, matches your runner’s label
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --production

      - name: Restart app with PM2
        run: |
          pm2 restart nodeapp || pm2 start app.js --name nodeapp
